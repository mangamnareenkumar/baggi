name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Expo App
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_AWS_REGION: ${{ secrets.EXPO_PUBLIC_AWS_REGION || 'ap-south-1' }}
          EXPO_PUBLIC_FACE_SYNC_API_URL: ${{ secrets.EXPO_PUBLIC_FACE_SYNC_API_URL || 'https://mtzktz5qy4zoskqgms6yfghk7i0vqtim.lambda-url.ap-south-1.on.aws/' }}
          EXPO_PUBLIC_FACE_SYNC_API_KEY: ${{ secrets.EXPO_PUBLIC_FACE_SYNC_API_KEY || 'some_random_string' }}
          EXPO_PUBLIC_AWS_S3_BUCKET: ${{ secrets.EXPO_PUBLIC_AWS_S3_BUCKET || 'your-datalake-face-templates-bucket' }}

      - name: Build Android APK (Debug & Release)
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug
        env:
          EXPO_PUBLIC_AWS_REGION: ${{ secrets.EXPO_PUBLIC_AWS_REGION || 'ap-south-1' }}
          EXPO_PUBLIC_FACE_SYNC_API_URL: ${{ secrets.EXPO_PUBLIC_FACE_SYNC_API_URL || 'https://mtzktz5qy4zoskqgms6yfghk7i0vqtim.lambda-url.ap-south-1.on.aws/' }}
          EXPO_PUBLIC_FACE_SYNC_API_KEY: ${{ secrets.EXPO_PUBLIC_FACE_SYNC_API_KEY || 'some_random_string' }}
          EXPO_PUBLIC_AWS_S3_BUCKET: ${{ secrets.EXPO_PUBLIC_AWS_S3_BUCKET || 'your-datalake-face-templates-bucket' }}

      - name: Sign Release APK (Optional)
        if: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build-artifacts
          
          # Copy debug APK (signed by debug key)
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/datalake-face-auth-debug.apk
          fi
          
          # Copy signed release APK if sign step succeeded
          if [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" build-artifacts/datalake-face-auth-release.apk
          # Otherwise copy the default release APK (typically unsigned release)
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-artifacts/datalake-face-auth-release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/datalake-face-auth-release-unsigned.apk
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-dev' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
