name: Build Android APKs

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # -------------------------------
      # ARM64 APK
      # -------------------------------

      - name: Build ARM64 APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a

      - name: Prepare ARM64 APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/release/*.apk \
            build-artifacts/datalake-face-auth-arm64.apk

      # -------------------------------
      # ARMv7 APK
      # -------------------------------

      - name: Build ARMv7 APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a

      - name: Prepare ARMv7 APK
        run: |
          cp android/app/build/outputs/apk/release/*.apk \
            build-artifacts/datalake-face-auth-armv7.apk

      # -------------------------------
      # Upload artifacts
      # -------------------------------

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: datalake-face-auth-apks
          path: build-artifacts/*.apk

      # -------------------------------
      # GitHub Release
      # -------------------------------

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/datalake-face-auth-arm64.apk
            build-artifacts/datalake-face-auth-armv7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}